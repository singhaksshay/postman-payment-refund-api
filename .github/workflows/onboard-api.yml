name: Onboard Payment Refund API

on:
  workflow_dispatch:
  push:
    paths:
      - 'specs/payment-refund-api-openapi.yaml'
      - '.github/workflows/onboard-api.yml'

jobs:
  onboard:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Create workspace and import spec
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          echo "Creating Payment Refund API workspace and importing spec..."
          WORKSPACE_RESPONSE=$(curl -s -X POST https://api.getpostman.com/workspaces \
            -H "X-API-Key: ${POSTMAN_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"workspace":{"name":"Payment Refund API - Development","type":"personal"}}')
          echo "Workspace response: $WORKSPACE_RESPONSE"
          WORKSPACE_ID=$(echo $WORKSPACE_RESPONSE | grep -o '"id":"[^"]*' | cut -d'"' -f4 | head -1)
          echo "Workspace ID: $WORKSPACE_ID"
          echo "Workspace created successfully"
