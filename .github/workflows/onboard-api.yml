name: Onboard Payment Refund API

on:
  workflow_dispatch:
  push:
    paths:
      - 'specs/payment-refund-api-openapi.yaml'
      - '.github/workflows/onboard-api.yml'

jobs:
  onboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      repository-projects: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.POSTMAN_GITHUB_TOKEN }}
      
      - name: Run Postman Onboarding
        uses: postman-cs/postman-api-onboarding-action@main
        with:
          spec-url: https://raw.githubusercontent.com/${{ github.repository }}/main/specs/payment-refund-api-openapi.yaml
          postman-api-key: ${{ secrets.POSTMAN_API_KEY }}
          project-name: "Payment Refund API"
          github-token: ${{ secrets.POSTMAN_GITHUB_TOKEN }}
